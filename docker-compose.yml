version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: keyles-postgres
    environment:
      POSTGRES_DB: keyles
      POSTGRES_USER: keyles
      POSTGRES_PASSWORD: keyles_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyles"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: keyles-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keyles-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=keyles
      - DB_USER=keyles
      - DB_PASSWORD=keyles_dev_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BREVO_API_KEY=${BREVO_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
      - GIN_MODE=debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: keyles-frontend
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_APP_NAME=Keyles SSO
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
