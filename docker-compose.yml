version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: keyles-postgres
    environment:
      POSTGRES_DB: keyles
      POSTGRES_USER: keyles
      POSTGRES_PASSWORD: keyles_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyles"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: keyles-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keyles-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=keyles
      - DB_USER=keyles
      - DB_PASSWORD=keyles_dev_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BREVO_API_KEY=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
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
      - GIN_MODE=release
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keyles-frontend
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_APP_NAME=Keyles SSO
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
