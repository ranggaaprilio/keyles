
services:
  postgres:
    image: postgres:15-alpine
    container_name: keyles-postgres
    environment:
      POSTGRES_DB: keyles
      POSTGRES_USER: keyles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyles"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: keyles-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keyles-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=keyles
      - DB_USER=keyles
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SKIP_EMAIL_VERIFICATION=${SKIP_EMAIL_VERIFICATION:-false}
      - GIN_MODE=release
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - OAUTH_ISSUER=${OAUTH_ISSUER:-http://localhost:8080}
      - SECURITY_COOKIE_SECURE=${SECURITY_COOKIE_SECURE:-false}
      - SECURITY_SESSION_TTL=28800
      - OAUTH_AUTH_TRANSACTION_TTL=600
      - RATE_LIMIT_OAUTH_LOGIN_FAILURES=5
      - RATE_LIMIT_OAUTH_LOGIN_WINDOW_SECONDS=900
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - CORS_ALLOWED_HEADERS=Origin,Content-Type,Accept,Authorization
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keyles-frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      - VITE_APP_NAME=Keyles SSO
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: keyles-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
